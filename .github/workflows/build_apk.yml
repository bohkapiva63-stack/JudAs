name: Build JudAs Google TV APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build JudAs Google TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python & Meson
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gettext pkg-config yasm nasm
          pip install --upgrade pip meson ninja

      - name: Configure Android SDK & NDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "Android SDK path: $ANDROID_SDK_ROOT"
          echo "Android NDK path: $ANDROID_NDK_LATEST_HOME"

      - name: Build JudAs Release APK
        run: |
          echo "Building JudAs for Google TV / Android TV..."
          mkdir -p build-android
          meson setup build-android --cross-file buildsystem/cross-android-arm64.txt --buildtype=release
          meson compile -C build-android

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JudAs-GoogleTV-v1.0.0.apk
          path: build-android/*
